<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./output.css">
    <title>Register</title>
</head>
<body class="bg-[#0f1117] text-white min-h-screen flex items-center justify-center px-4">
 
  <div class="w-full max-w-sm">
 
    <div class="mb-8 text-center">
      <div class="w-12 h-12 rounded-2xl bg-indigo-500 flex items-center justify-center mx-auto mb-4">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round" d="M8 10h.01M12 10h.01M16 10h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
        </svg>
      </div>
      <h1 class="text-xl font-semibold tracking-wide">Create account</h1>
      <p class="text-sm text-gray-500 mt-1">Join the crew</p>
    </div>
 
    <div class="bg-[#181b23] border border-[#2a2d3a] rounded-2xl p-6 flex flex-col gap-4">
 
      <div id="error-msg" class="hidden bg-red-500/10 border border-red-500/20 text-red-400 text-xs px-4 py-2.5 rounded-lg"></div>
 
      <div id="success-msg" class="hidden bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-xs px-4 py-2.5 rounded-lg">
        Account created! Redirecting to login...
      </div>
 
      <div class="flex flex-col gap-1.5">
        <label class="text-xs text-gray-500 tracking-wide">Full name</label>
        <input
          id="fullname"
          type="text"
          placeholder="e.g. Dev Nam"
          class="bg-[#1e2130] border border-[#2a2d3a] rounded-xl px-4 py-2.5 text-sm text-white placeholder-gray-600 outline-none focus:border-indigo-500 transition"
        />
      </div>
 
      <div class="flex flex-col gap-1.5">
        <label class="text-xs text-gray-500 tracking-wide">Username</label>
        <input
          id="username"
          type="text"
          placeholder="e.g. devnam"
          class="bg-[#1e2130] border border-[#2a2d3a] rounded-xl px-4 py-2.5 text-sm text-white placeholder-gray-600 outline-none focus:border-indigo-500 transition"
        />
      </div>
 
      <div class="flex flex-col gap-1.5">
        <label class="text-xs text-gray-500 tracking-wide">Password</label>
        <input
          id="password"
          type="password"
          placeholder="••••••••"
          class="bg-[#1e2130] border border-[#2a2d3a] rounded-xl px-4 py-2.5 text-sm text-white placeholder-gray-600 outline-none focus:border-indigo-500 transition"
        />
      </div>
 
      <button
        id="register-btn"
        class="mt-1 bg-indigo-500 hover:bg-indigo-600 transition text-white text-sm font-semibold py-2.5 rounded-xl tracking-wide"
      >
        Create account
      </button>
 
    </div>
 
    <p class="text-center text-xs text-gray-500 mt-5">
      Already have an account?
      <a href="login.html" class="text-indigo-400 hover:text-indigo-300 transition font-medium">Log in</a>
    </p>
 
  </div>
 
  <script>
    const registerBtn  = document.getElementById('register-btn')
    const errorMsg     = document.getElementById('error-msg')
    const successMsg   = document.getElementById('success-msg')
    const fullname     = document.getElementById('fullname')
    const username     = document.getElementById('username')
    const password     = document.getElementById('password')

    registerBtn.addEventListener('click', () => {
      const name = fullname.value.trim()
      const user = username.value.trim()
      const pass = password.value.trim()

      if (!name || !user || !pass) {
        errorMsg.textContent = 'All fields are required.'
        errorMsg.classList.remove('hidden')
        successMsg.classList.add('hidden')
        return
      }

      const users = JSON.parse(localStorage.getItem('users') || '[]')
      if (users.some(u => u.username === user)) {
        errorMsg.textContent = 'Username already taken.'
        errorMsg.classList.remove('hidden')
        successMsg.classList.add('hidden')
        return
      }

      users.push({ fullname: name, username: user, password: pass })
      localStorage.setItem('users', JSON.stringify(users))

      errorMsg.classList.add('hidden')
      successMsg.classList.remove('hidden')
      setTimeout(() => {
        window.location.href = './Login.html'
      }, 2000)
    })
  </script>
 
</body>
</html>
