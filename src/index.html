<body class="bg-[#0f1117] text-white h-screen flex flex-col max-w-sm mx-auto">

      <p class="text-sm font-semibold tracking-wide">Dev Crew</p>
      <p id="online-count" class="text-xs text-gray-500">0 members</p>

    <div class="flex items-end gap-2 max-w-[78%]">

      <div>
        <p class="text-xs text-gray-500 mb-1 ml-1">mp</p>
        <div class="bg-[#1e2130] text-gray-400 text-sm px-4 py-2.5 rounded-tl border border-[#2a2d3a] rounded-tr-2xl rounded-br-2xl rounded-bl-2xl leading-relaxed">
          What's up, chat?
        </div>
        <p class="text-[10px] text-gray-600 mt-1 ml-1">15:45</p>
      </div>
    </div>
 
    <div class="flex items-end gap-2 max-w-[85%]">
      <div class="w-7 h-7 rounded-full bg-emerald-500/20 border border-emerald-500/30 flex items-center justify-center text-emerald-400 text-[11px] font-semibold tracking-wider flex-shrink-0">k9</div>
      <div>
        <p class="text-xs text-gray-500 mb-1 ml-1">k9</p>
        <div class="bg-[#1e2130] text-gray-400 text-sm px-4 py-2.5 rounded-tl border border-[#2a2d3a] rounded-tr-2xl rounded-br-2xl rounded-bl-2xl leading-relaxed">
          All good fam, what's the good word?
        </div>
        <p class="text-[10px] text-gray-600 mt-1 ml-1">15:46</p>
      </div>
    </div>
 
    <div class="flex items-end gap-2 max-w-[72%] self-end flex-row-reverse">
      <div class="w-7 h-7 rounded-full bg-indigo-500/20 border border-indigo-500/40 flex items-center justify-center text-indigo-400 text-[11px] font-semibold tracking-wider flex-shrink-0">de</div>
      <div class="flex flex-col items-end">
        <p class="text-xs text-gray-500 mb-1 mr-1">de</p>
        <div class="bg-indigo-500 text-white text-sm px-4 py-2.5 rounded-tr rounded-tl-2xl rounded-bl-2xl rounded-br-2xl leading-relaxed">
          Hello, Devs!
        </div>
        <p class="text-[10px] text-gray-600 mt-1 mr-1">15:46</p>
      </div>
    </div>
 
    <div class="flex items-end gap-2 max-w-[78%]">
      <div class="w-7 h-7 rounded-full bg-emerald-500/20 border border-emerald-500/30 flex items-center justify-center text-emerald-400 text-[11px] font-semibold tracking-wider flex-shrink-0">k9</div>
      <div>
        <p class="text-xs text-gray-500 mb-1 ml-1">k9</p>
        <div class="bg-[#1e2130] text-gray-400 text-sm px-4 py-2.5 rounded-tl border border-[#2a2d3a] rounded-tr-2xl rounded-br-2xl rounded-bl-2xl leading-relaxed">
          Super Dev Nam!
        </div>
        <p class="text-[10px] text-gray-600 mt-1 ml-1">15:47</p>
      </div>
    </div>
 
    <div class="flex items-end gap-2 max-w-[72%] self-end flex-row-reverse">
      <div class="w-7 h-7 rounded-full bg-indigo-500/20 border border-indigo-500/40 flex items-center justify-center text-indigo-400 text-[11px] font-semibold tracking-wider flex-shrink-0">de</div>
      <div class="flex flex-col items-end">
        <p class="text-xs text-gray-500 mb-1 mr-1">de</p>
        <div class="bg-indigo-500 text-white text-sm px-4 py-2.5 rounded-tr rounded-tl-2xl rounded-bl-2xl rounded-br-2xl leading-relaxed">
          Yes ol Uncle k9 😄
        </div>
        <p class="text-[10px] text-gray-600 mt-1 mr-1">15:47</p>
      </div>
    </div>
 >
    <div class="flex items-end gap-2 max-w-[82%]">
      <div class="w-7 h-7 rounded-full bg-rose-500/20 border border-rose-500/30 flex items-center justify-center text-rose-400 text-[11px] font-semibold tracking-wider flex-shrink-0">mp</div>
      <div>
        <p class="text-xs text-gray-500 mb-1 ml-1">mp</p>
        <div class="bg-[#1e2130] text-gray-400 text-sm px-4 py-2.5 rounded-tl border border-[#2a2d3a] rounded-tr-2xl rounded-br-2xl rounded-bl-2xl leading-relaxed">
          DOM manipulation is genuinely fun ngl
        </div>
        <p class="text-[10px] text-gray-600 mt-1 ml-1">15:48</p>
      </div>
    </div>
 
  </div>
 
  <div class="px-4 py-3 border-t border-[#2a2d3a] bg-[#181b23]">
    <div class="flex items-center gap-3 bg-[#1e2130] border border-[#2a2d3a] rounded-xl px-4 py-2.5">
      <input
        id="msg-input"
        type="text"
        placeholder="What's happening?"
        class="flex-1 bg-transparent text-sm text-white placeholder-gray-600 outline-none"
      />
      <button id="send-btn" class="text-indigo-400 hover:text-white transition flex-shrink-0">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
        </svg>
      </button>
    </div>
  </div>
 
  <script>
    const messagesEl   = document.getElementById('messages')
    const msgInput     = document.getElementById('msg-input')
    const sendBtn      = document.getElementById('send-btn')
    const onlineCount  = document.getElementById('online-count')
    const logoutBtn    = document.getElementById('logout-btn')

const currentUser = JSON.parse(localStorage.getItem('currentUser'))
if (!currentUser) {
  window.location.href = 'login.html'
} else {
  onlineCount.textContent = 'You are logged in as ' + currentUser.username

  sendBtn.addEventListener('click', () => {
    const text = msgInput.value.trim()
    if (!text) return

    messagesEl.innerHTML += `
      <div class="flex items-end gap-2 max-w-[72%] self-end flex-row-reverse">
        <div class="w-7 h-7 rounded-full bg-indigo-500/20 border border-indigo-500/40 flex items-center justify-center text-indigo-400 text-[11px] font-semibold flex-shrink-0">
          ${currentUser.username.slice(0, 2)}
        </div>
        <div class="flex flex-col items-end">
          <p class="text-xs text-gray-500 mb-1 mr-1">${currentUser.username}</p>
          <div class="bg-indigo-500 text-white text-sm px-4 py-2.5 rounded-tr rounded-tl-2xl rounded-bl-2xl rounded-br-2xl leading-relaxed">
            ${text}
          </div>
        </div>
      </div>
    `

    msgInput.value = ''
    messagesEl.scrollTop = messagesEl.scrollHeight
  })

  msgInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendBtn.click()
  })

  logoutBtn.addEventListener('click', () => {
    localStorage.removeItem('currentUser')
    window.location.href = 'login.html'
  })

}
  </script>
 
</body>
</html>
